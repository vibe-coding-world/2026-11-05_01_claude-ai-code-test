<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code テストページ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1rem;
      text-align: center;
      background: #faf7f2;
      color: #333;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      background: #d97757;
      color: #fff;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    #message { margin-top: 1.5rem; font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>こんにちは、Claude Code!</h1>
  <p>claude.ai/code から作成したテストページです。</p>
  <button id="btn">クリックしてね</button>
  <p id="message"></p>

  <script>
    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      count++;
      document.getElementById('message').textContent = count + ' 回クリックされました';
    });
  </script>
</body>
</html>
