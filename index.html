<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code テストページ</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #2b2a28;
      --muted: #7a766f;
      --accent: #d97757;
      --accent-dark: #b85f41;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    /* OSの設定がダークで、手動でライトを選んでいない場合 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1b19;
        --card: #2a2825;
        --text: #f1ede6;
        --muted: #a39e94;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }
    /* 手動でダークを選んだ場合 */
    :root[data-theme="dark"] {
      --bg: #1c1b19;
      --card: #2a2825;
      --text: #f1ede6;
      --muted: #a39e94;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      margin-bottom: 1rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
    p.lead { margin: 0 0 2rem; color: var(--muted); line-height: 1.7; }
    .count {
      margin: 0 0 1.5rem;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .count small { display: block; font-size: 0.85rem; font-weight: 400; color: var(--muted); }
    .buttons { display: flex; gap: 0.75rem; justify-content: center; }
    button {
      padding: 0.75rem 1.5rem;
      border: 2px solid var(--accent);
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.96); }
    #plus { background: var(--accent); color: #fff; }
    #plus:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    #reset { background: transparent; color: var(--accent); }
    #reset:hover { background: rgba(217, 119, 87, 0.12); }
    button:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }
    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      transition: none; /* 切替時に背景だけ遅れて変わり、文字が読めなくなるのを防ぐ */
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="ダークモードとライトモードを切り替える"></button>
  <main class="card">
    <span class="badge">TEST PAGE</span>
    <h1>こんにちは、Claude Code!</h1>
    <p class="lead">claude.ai/code から作成した<br>テストページです。</p>
    <div class="count"><span id="count">0</span><small>クリック数</small></div>
    <div class="buttons">
      <button id="plus">クリックしてね</button>
      <button id="reset">リセット</button>
    </div>
  </main>

  <script>
    let count = 0;
    const el = document.getElementById('count');
    document.getElementById('plus').addEventListener('click', () => {
      el.textContent = ++count;
    });
    document.getElementById('reset').addEventListener('click', () => {
      count = 0;
      el.textContent = count;
    });

    // ダークモード切替(選択はブラウザに保存。保存できない環境でも動く)
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function currentTheme() {
      return root.dataset.theme || (systemDark.matches ? 'dark' : 'light');
    }
    function updateLabel() {
      toggle.textContent = currentTheme() === 'dark' ? '☀️ ライト' : '🌙 ダーク';
    }

    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
    } catch (e) { /* 保存された設定は使わない */ }
    updateLabel();

    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) { /* 保存は諦める */ }
      updateLabel();
    });
    systemDark.addEventListener('change', updateLabel);
  </script>
</body>
</html>
